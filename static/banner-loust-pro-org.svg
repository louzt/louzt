<?xml version="1.0" encoding="UTF-8"?>
<!--
  banner-loust-pro-org.svg — B2B Open Source & Enterprise Substrates banner (1200x120).
  Uses grid + mesh pattern matching profile-header.svg (40px/30s & 80px/60s).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="LOUST-PRO Open Source &amp; Enterprise Substrates">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.4"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="40 0" dur="30s" repeatCount="indefinite"/>
    </pattern>
    <pattern id="mesh" width="80" height="80" patternUnits="userSpaceOnUse">
      <circle cx="0" cy="0" r="1.5" fill="#38bdf8" fill-opacity="0.3"/>
      <circle cx="80" cy="0" r="1.5" fill="#38bdf8" fill-opacity="0.3"/>
      <circle cx="0" cy="80" r="1.5" fill="#38bdf8" fill-opacity="0.3"/>
      <circle cx="80" cy="80" r="1.5" fill="#38bdf8" fill-opacity="0.3"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="80 0" dur="60s" repeatCount="indefinite"/>
    </pattern>

    <!-- Gradient Overlays -->
    <linearGradient id="card-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="border-glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Card Background with Border -->
  <rect x="2" y="2" width="1196" height="116" rx="8" fill="url(#card-bg)" stroke="url(#border-glow)" stroke-width="1.5"/>

  <!-- Animated Grid & Mesh Overlays -->
  <rect x="4" y="4" width="1192" height="112" rx="6" fill="url(#grid)"/>
  <rect x="4" y="4" width="1192" height="112" rx="6" fill="url(#mesh)"/>

  <!-- Subtle Corner Brackets -->
  <path d="M 16 24 L 16 16 L 24 16" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <path d="M 1184 24 L 1184 16 L 1176 16" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round"/>
  <path d="M 16 96 L 16 104 L 24 104" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <path d="M 1184 96 L 1184 104 L 1176 104" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round"/>

  <!-- Centered Text -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="600" y="52" font-size="20" font-weight="800" fill="#f8fafc" letter-spacing="2">
      LOUST-PRO OPEN SOURCE &amp; ENTERPRISE SUBSTRATES
    </text>
    <text x="600" y="78" font-size="13" font-weight="400" fill="#94a3b8" letter-spacing="0.5">
      Production toolkits, MCP servers, Rust/Go binaries, and local-first agent control planes
    </text>
  </g>
</svg>
