<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 4" width="100%" height="4" role="img" preserveAspectRatio="none">
  <defs>
    <linearGradient id="lava-pink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ec4899">
        <animate attributeName="stop-color" values="#ec4899;#8b5cf6;#14b8a6;#ec4899" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#ec4899;#326ce5;#8b5cf6" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#326ce5">
        <animate attributeName="stop-color" values="#326ce5;#10b981;#ec4899;#326ce5" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>
  <rect width="600" height="4" rx="2" fill="url(#lava-pink)"/>
</svg>
