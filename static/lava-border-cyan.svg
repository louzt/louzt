<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 4" width="100%" height="4" role="img" preserveAspectRatio="none">
  <defs>
    <linearGradient id="lava-cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#10b981;#6366f1;#38bdf8" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#10b981">
        <animate attributeName="stop-color" values="#10b981;#38bdf8;#8b5cf6;#10b981" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1;#14b8a6;#38bdf8;#6366f1" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>
  <rect width="600" height="4" rx="2" fill="url(#lava-cyan)"/>
