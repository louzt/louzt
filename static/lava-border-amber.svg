<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 4" width="100%" height="4" role="img" preserveAspectRatio="none">
  <defs>
    <linearGradient id="lava-amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b">
        <animate attributeName="stop-color" values="#f59e0b;#eb0029;#10b981;#f59e0b" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#eb0029">
        <animate attributeName="stop-color" values="#eb0029;#f59e0b;#ec4899;#eb0029" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ec4899">
        <animate attributeName="stop-color" values="#ec4899;#38bdf8;#f59e0b;#ec4899" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>
  <rect width="600" height="4" rx="2" fill="url(#lava-amber)"/>
</svg>
