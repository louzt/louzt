<?xml version="1.0" encoding="UTF-8"?>
<!--
  profile-footer.svg — local mirror (preview-only).
  Original asset path: https://loust.pro/assets/profile-footer.svg

  Rebuilt 2026-07-14 per operator directive: "footer svg que sea cta
  inv" — footer reframed as a clear call-to-action / invite block.
  Keeps the SAME grid + mesh pattern as the hero (lines 73-83 of
  profile-header.svg) — diagonal animation, soft white strokes, no
  colored sweep beam, no colored accent cubes. CTA line + 3 contact
  channels + audit signal.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="loust footer — call to action invite">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="translate(0,0)">
      <path d="M40 0 L0 0 0 40" stroke="#ffffff" stroke-opacity="0.05" fill="none"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0,0" to="40,40" dur="30s" repeatCount="indefinite"/>
    </pattern>
    <pattern id="mesh" width="80" height="80" patternUnits="userSpaceOnUse" patternTransform="translate(0,0)">
      <path d="M0 0 L80 0 L80 80 L0 80 Z" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
      <path d="M0 40 L80 40" stroke="#ffffff" stroke-opacity="0.06"/>
      <path d="M40 0 L40 80" stroke="#ffffff" stroke-opacity="0.06"/>
      <circle cx="40" cy="40" r="1.2" fill="#ffffff" fill-opacity="0.15"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0,0" to="80,80" dur="45s" repeatCount="indefinite"/>
    </pattern>
  </defs>

  <!-- Background + mesh + grid (matches hero pattern exactly) -->
  <rect width="1200" height="260" fill="url(#bg)"/>
  <rect width="1200" height="260" fill="url(#mesh)" opacity="0.55"/>
  <rect width="1200" height="260" fill="url(#grid)" opacity="0.75"/>

  <!-- CTA line 1: primary invite -->
  <text x="600" y="78" text-anchor="middle"
        font-family="Inter, ui-sans-serif, system-ui, sans-serif"
        font-size="26" font-weight="700" fill="#e2e8f0" letter-spacing="0.6">
    Open to long-running collaborations
  </text>

  <!-- CTA line 2: routing prompt -->
  <text x="600" y="112" text-anchor="middle"
        font-family="Inter, ui-sans-serif, system-ui, sans-serif"
        font-size="14" font-weight="500" fill="#cbd5e1" letter-spacing="0.4">
    Research · OSS hardening · B2B platform work · HackerOne disclosure
  </text>

  <!-- CTA line 3: contact channels -->
  <text x="600" y="160" text-anchor="middle"
        font-family="ui-monospace, monospace"
        font-size="13" fill="#94a3b8" letter-spacing="0.3">
    research@loust.pro  ·  partnership@loust.pro  ·  security@loust.pro
  </text>

  <!-- Audit signal below -->
  <text x="600" y="208" text-anchor="middle"
        font-family="ui-monospace, monospace"
        font-size="10" fill="#475569" letter-spacing="0.6">
    Production systems · Real operators · Audit-first workflow
  </text>
</svg>
