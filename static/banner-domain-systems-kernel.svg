<?xml version="1.0" encoding="UTF-8"?>
<!--
  banner-domain-systems-kernel.svg — Systems & Kernel Domain Banner (1200x65).
  Velocity lockstep grid (30s/60s) + SMIL animated lava-lamp cyber border glow.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 65" width="1200" height="65" role="img" aria-label="Systems, Vulkan and Kernel Hardening Domain Banner">
  <defs>
    <pattern id="grid1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.4"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="40 0" dur="30s" repeatCount="indefinite"/>
    </pattern>
    <pattern id="mesh1" width="80" height="80" patternUnits="userSpaceOnUse">
      <circle cx="0" cy="0" r="1.5" fill="#eb0029" fill-opacity="0.35"/>
      <circle cx="80" cy="0" r="1.5" fill="#eb0029" fill-opacity="0.35"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="80 0" dur="60s" repeatCount="indefinite"/>
    </pattern>
    <linearGradient id="card-bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="border-glow1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#eb0029">
        <animate attributeName="stop-color" values="#eb0029;#f59e0b;#38bdf8;#eb0029" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#f59e0b">
        <animate attributeName="stop-color" values="#f59e0b;#8b5cf6;#eb0029;#f59e0b" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#eb0029;#f59e0b;#38bdf8" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="1196" height="61" rx="6" fill="url(#card-bg1)" stroke="url(#border-glow1)" stroke-width="1.5"/>
  <rect x="4" y="4" width="1192" height="57" rx="4" fill="url(#grid1)"/>
  <rect x="4" y="4" width="1192" height="57" rx="4" fill="url(#mesh1)"/>

  <path d="M 12 16 L 12 10 L 18 10" fill="none" stroke="#eb0029" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 1188 16 L 1188 10 L 1182 10" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 12 49 L 12 55 L 18 55" fill="none" stroke="#eb0029" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 1188 49 L 1188 55 L 1182 55" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>

  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="600" y="29" font-size="15" font-weight="800" fill="#f8fafc" letter-spacing="1.5">
      🎮 SYSTEMS, VULKAN &amp; KERNEL HARDENING
    </text>
    <text x="600" y="47" font-size="11" font-weight="400" fill="#94a3b8" letter-spacing="0.5">
      POSIX reapers, Vulkan shader replayers, DKMS driver patches &amp; kernel thread safety
    </text>
  </g>
</svg>
