<?xml version="1.0" encoding="UTF-8"?>
<!--
  section-tactical-posture.svg — Quantum Atomic Core Divider Banner (1200x110).
  Features: Deep obsidian background, centered 3D quantum atomic core with 3 symmetrical,
  independently rotating electron orbital rings, high-density energy nucleus, and zero star/moon clutter.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" width="1200" height="110" role="img" aria-label="Quantum Atomic Core — Section Divider">
  <defs>
    <!-- Deep obsidian space gradient -->
    <linearGradient id="quantum-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#070d18"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Subatomic Core Radial Gradient -->
    <radialGradient id="atomic-nucleus" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="75%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>

    <!-- Quantum Energy Glow Filter -->
    <filter id="nucleus-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Atomic Orbit Gradients -->
    <linearGradient id="orbit-grad-1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="orbit-grad-2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="orbit-grad-3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Clean Obsidian Background Canvas -->
  <rect width="1200" height="110" fill="url(#quantum-bg)"/>

  <!-- Ambient Subatomic Aura Layer -->
  <circle cx="600" cy="55" r="50" fill="#38bdf8" fill-opacity="0.08" filter="url(#nucleus-glow)">
    <animate attributeName="r" values="45;55;45" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- Central Quantum Atomic Model -->
  <g transform="translate(600, 55)">

    <!-- Atomic Orbit 1: Tilted -35 deg -->
    <g transform="rotate(-35)">
      <ellipse cx="0" cy="0" rx="60" ry="19" fill="none" stroke="url(#orbit-grad-1)" stroke-width="1.6"/>
      <circle cx="60" cy="0" r="3" fill="#7dd3fc" filter="url(#nucleus-glow)"/>
      <animateTransform attributeName="transform" type="rotate" from="-35" to="325" dur="14s" repeatCount="indefinite"/>
    </g>

    <!-- Atomic Orbit 2: Tilted +35 deg -->
    <g transform="rotate(35)">
      <ellipse cx="0" cy="0" rx="60" ry="19" fill="none" stroke="url(#orbit-grad-2)" stroke-width="1.6"/>
      <circle cx="-60" cy="0" r="3" fill="#e9d5ff" filter="url(#nucleus-glow)"/>
      <animateTransform attributeName="transform" type="rotate" from="35" to="-325" dur="18s" repeatCount="indefinite"/>
    </g>

    <!-- Atomic Orbit 3: Vertical 90 deg -->
    <g transform="rotate(90)">
      <ellipse cx="0" cy="0" rx="60" ry="19" fill="none" stroke="url(#orbit-grad-3)" stroke-width="1.6"/>
      <circle cx="60" cy="0" r="3" fill="#a7f3d0" filter="url(#nucleus-glow)"/>
      <animateTransform attributeName="transform" type="rotate" from="90" to="450" dur="22s" repeatCount="indefinite"/>
    </g>

    <!-- High-Density Subatomic Nucleus -->
    <circle cx="0" cy="0" r="22" fill="url(#atomic-nucleus)" filter="url(#nucleus-glow)">
      <animate attributeName="r" values="21;23.5;21" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
