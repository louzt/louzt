<?xml version="1.0" encoding="UTF-8"?>
<!--
  section-tactical-posture.svg — Enhanced Quantum Atomic Core Divider Banner (1200x110).
  Features: Deep obsidian background with 3D isometric quantum mesh, 4 multi-spectrum orbital rings,
  glowing photon nodes, multi-layered energy aura, and high-density pulsing nucleus.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" width="1200" height="110" role="img" aria-label="Quantum Atomic Core — Section Divider">
  <defs>
    <!-- Deep obsidian space gradient -->
    <linearGradient id="quantum-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#080e1e"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- 3D Isometric Quantum Mesh Pattern -->
    <pattern id="iso-grid" width="60" height="34.641" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 60 17.32 L 30 34.64 L 0 17.32 Z M 30 0 L 30 34.64 M 0 17.32 L 60 17.32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="0.8"/>
      <circle cx="30" cy="17.32" r="0.9" fill="#38bdf8" fill-opacity="0.25"/>
    </pattern>

    <!-- Subatomic Core Radial Gradient -->
    <radialGradient id="atomic-nucleus" cx="38%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="22%" stop-color="#bae6fd"/>
      <stop offset="48%" stop-color="#38bdf8"/>
      <stop offset="72%" stop-color="#6366f1"/>
      <stop offset="90%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Quantum Energy Glow Filter -->
    <filter id="nucleus-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Multi-Spectrum Orbital Ring Gradients -->
    <linearGradient id="orbit-cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="orbit-violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="orbit-emerald" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="orbit-rose" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#fb7185" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Background Canvas -->
  <rect width="1200" height="110" fill="url(#quantum-bg)"/>

  <!-- 3D Isometric Quantum Mesh Layer -->
  <rect width="1200" height="110" fill="url(#iso-grid)"/>

  <!-- Multi-Layer Ambient Energy Aura -->
  <circle cx="600" cy="55" r="55" fill="#6366f1" fill-opacity="0.06" filter="url(#nucleus-glow)">
    <animate attributeName="r" values="50;62;50" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="55" r="42" fill="#38bdf8" fill-opacity="0.1" filter="url(#nucleus-glow)">
    <animate attributeName="r" values="38;46;38" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Central Quantum Atomic Model -->
  <g transform="translate(600, 55)">

    <!-- Orbit 1: Cyan (-35 deg) -->
    <g transform="rotate(-35)">
      <ellipse cx="0" cy="0" rx="64" ry="20" fill="none" stroke="url(#orbit-cyan)" stroke-width="1.6"/>
      <circle cx="64" cy="0" r="3.2" fill="#bae6fd" filter="url(#nucleus-glow)"/>
      <animateTransform attributeName="transform" type="rotate" from="-35" to="325" dur="14s" repeatCount="indefinite"/>
    </g>

    <!-- Orbit 2: Violet (+35 deg) -->
    <g transform="rotate(35)">
      <ellipse cx="0" cy="0" rx="64" ry="20" fill="none" stroke="url(#orbit-violet)" stroke-width="1.6"/>
      <circle cx="-64" cy="0" r="3.2" fill="#e9d5ff" filter="url(#nucleus-glow)"/>
      <animateTransform attributeName="transform" type="rotate" from="35" to="-325" dur="18s" repeatCount="indefinite"/>
    </g>

    <!-- Orbit 3: Emerald (90 deg) -->
    <g transform="rotate(90)">
      <ellipse cx="0" cy="0" rx="64" ry="20" fill="none" stroke="url(#orbit-emerald)" stroke-width="1.6"/>
      <circle cx="64" cy="0" r="3.2" fill="#a7f3d0" filter="url(#nucleus-glow)"/>
      <animateTransform attributeName="transform" type="rotate" from="90" to="450" dur="22s" repeatCount="indefinite"/>
    </g>

    <!-- Orbit 4: Rose (-70 deg) -->
    <g transform="rotate(-70)">
      <ellipse cx="0" cy="0" rx="64" ry="20" fill="none" stroke="url(#orbit-rose)" stroke-width="1.2" stroke-dasharray="8 4"/>
      <circle cx="-64" cy="0" r="2.8" fill="#fecdd3" filter="url(#nucleus-glow)"/>
      <animateTransform attributeName="transform" type="rotate" from="-70" to="290" dur="26s" repeatCount="indefinite"/>
    </g>

    <!-- High-Density Subatomic Nucleus -->
    <circle cx="0" cy="0" r="23" fill="url(#atomic-nucleus)" filter="url(#nucleus-glow)">
      <animate attributeName="r" values="22;24.5;22" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
