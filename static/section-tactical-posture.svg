<?xml version="1.0" encoding="UTF-8"?>
<!--
  section-tactical-posture.svg — Cosmic Universe Sphere divider banner (1200x110).
  Features: Canonical GFM grid + mesh background with centered dots (matching hero & section banners),
  synchronized 1.33px/s diagonal motion, central animated cosmic sphere with orbital rings,
  glowing nebula core, and rotating celestial particles.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" width="1200" height="110" role="img" aria-label="Cosmic Universe Sphere — Section Divider">
  <defs>
    <!-- Dark background gradient (matches hero & section banners) -->
    <linearGradient id="space-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Synchronized Grid + Mesh pattern (40px cell, 30s & 60s for 1.33 px/s lockstep motion) -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="translate(0,0)">
      <path d="M40 0 L0 0 0 40" stroke="#ffffff" stroke-opacity="0.05" fill="none"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0,0" to="40,40" dur="30s" repeatCount="indefinite"/>
    </pattern>

    <!-- Mesh overlay with centered dots at line intersections -->
    <pattern id="mesh" width="80" height="80" patternUnits="userSpaceOnUse" patternTransform="translate(0,0)">
      <path d="M0 0 L80 0 L80 80 L0 80 Z" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
      <path d="M0 40 L80 40" stroke="#ffffff" stroke-opacity="0.06"/>
      <path d="M40 0 L40 80" stroke="#ffffff" stroke-opacity="0.06"/>
      <circle cx="40" cy="40" r="1.2" fill="#ffffff" fill-opacity="0.18"/>
      <circle cx="0" cy="0" r="1.2" fill="#ffffff" fill-opacity="0.18"/>
      <circle cx="80" cy="0" r="1.2" fill="#ffffff" fill-opacity="0.18"/>
      <circle cx="0" cy="80" r="1.2" fill="#ffffff" fill-opacity="0.18"/>
      <circle cx="80" cy="80" r="1.2" fill="#ffffff" fill-opacity="0.18"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0,0" to="80,80" dur="60s" repeatCount="indefinite"/>
    </pattern>

    <!-- Core Universe Sphere Radial Gradient -->
    <radialGradient id="sphere-core" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="25%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#6366f1"/>
      <stop offset="85%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Atmosphere Glow Filter -->
    <filter id="cosmic-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Orbital Ring Gradients -->
    <linearGradient id="ring-grad-1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="ring-grad-2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas + Mesh + Grid (matches hero & section banners) -->
  <rect width="1200" height="110" fill="url(#space-bg)"/>
  <rect width="1200" height="110" fill="url(#mesh)" opacity="0.6"/>
  <rect width="1200" height="110" fill="url(#grid)" opacity="0.8"/>

  <!-- Horizontal Metallic Divider Bevel Lines -->
  <line x1="50" y1="55" x2="520" y2="55" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="120" y1="55" x2="520" y2="55" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>

  <line x1="680" y1="55" x2="1150" y2="55" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="680" y1="55" x2="1080" y2="55" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Distant Twinkling Stars -->
  <g opacity="0.6">
    <circle cx="180" cy="30" r="1" fill="#ffffff"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="80" r="1.5" fill="#38bdf8"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="25" r="1.2" fill="#8b5cf6"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="1020" cy="75" r="1" fill="#ffffff"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Central Cosmic Universe Sphere Group -->
  <g transform="translate(600, 55)">
    <!-- Outer Glow Aura -->
    <circle cx="0" cy="0" r="38" fill="#6366f1" fill-opacity="0.15" filter="url(#cosmic-glow)">
      <animate attributeName="r" values="36;42;36" dur="6s" repeatCount="indefinite"/>
    </circle>

    <!-- Outer Orbital Ring 1 (Tilted & Rotating) -->
    <g>
      <ellipse cx="0" cy="0" rx="55" ry="18" fill="none" stroke="url(#ring-grad-1)" stroke-width="1.8" transform="rotate(-22)">
        <animateTransform attributeName="transform" type="rotate" from="-22" to="338" dur="24s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- Outer Orbital Ring 2 (Counter-Rotating) -->
    <g>
      <ellipse cx="0" cy="0" rx="46" ry="14" fill="none" stroke="url(#ring-grad-2)" stroke-width="1.2" stroke-dasharray="6 4" transform="rotate(35)">
        <animateTransform attributeName="transform" type="rotate" from="35" to="-325" dur="18s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- Main Universe Celestial Sphere Body -->
    <circle cx="0" cy="0" r="30" fill="url(#sphere-core)" filter="url(#cosmic-glow)"/>

    <!-- Latitude Grid Line on Sphere (Rotating Effect) -->
    <ellipse cx="0" cy="0" rx="30" ry="10" fill="none" stroke="#bae6fd" stroke-opacity="0.4" stroke-width="0.8">
      <animate attributeName="ry" values="10;0;10" dur="8s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="0" rx="12" ry="30" fill="none" stroke="#bae6fd" stroke-opacity="0.3" stroke-width="0.8">
      <animate attributeName="rx" values="12;0;12" dur="8s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Orbiting Particle Moons / Stellar Nodes -->
    <g>
      <circle cx="55" cy="0" r="2.5" fill="#38bdf8" filter="url(#cosmic-glow)"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </g>

    <g>
      <circle cx="-42" cy="0" r="2" fill="#f59e0b" filter="url(#cosmic-glow)"/>
      <animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="12s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
