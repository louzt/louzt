<?xml version="1.0" encoding="UTF-8"?>
<!--
  section-tactical-posture.svg — Cosmic Universe Sphere divider banner (1200x110).
  Features: Clean deep space canvas, distant twinkling stars, central animated cosmic sphere
  with orbital rings, glowing nebula core, and rotating celestial particles.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" width="1200" height="110" role="img" aria-label="Cosmic Universe Sphere — Section Divider">
  <defs>
    <!-- Deep space background gradient -->
    <linearGradient id="space-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#080d1a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Core Universe Sphere Radial Gradient -->
    <radialGradient id="sphere-core" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="25%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#6366f1"/>
      <stop offset="85%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Atmosphere Glow Filter -->
    <filter id="cosmic-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Orbital Ring Gradients -->
    <linearGradient id="ring-grad-1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="ring-grad-2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Clean Deep Space Background Canvas -->
  <rect width="1200" height="110" fill="url(#space-bg)"/>

  <!-- Distant Twinkling Stars -->
  <g opacity="0.6">
    <circle cx="120" cy="45" r="1.2" fill="#ffffff"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="280" cy="30" r="1" fill="#38bdf8"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="80" r="1.5" fill="#ffffff"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="35" r="1.2" fill="#8b5cf6"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="940" cy="75" r="1" fill="#ffffff"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="40" r="1.3" fill="#38bdf8"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Central Cosmic Universe Sphere Group -->
  <g transform="translate(600, 55)">
    <!-- Outer Glow Aura -->
    <circle cx="0" cy="0" r="38" fill="#6366f1" fill-opacity="0.15" filter="url(#cosmic-glow)">
      <animate attributeName="r" values="36;42;36" dur="6s" repeatCount="indefinite"/>
    </circle>

    <!-- Outer Orbital Ring 1 (Tilted & Rotating) -->
    <g>
      <ellipse cx="0" cy="0" rx="55" ry="18" fill="none" stroke="url(#ring-grad-1)" stroke-width="1.8" transform="rotate(-22)">
        <animateTransform attributeName="transform" type="rotate" from="-22" to="338" dur="24s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- Outer Orbital Ring 2 (Counter-Rotating) -->
    <g>
      <ellipse cx="0" cy="0" rx="46" ry="14" fill="none" stroke="url(#ring-grad-2)" stroke-width="1.2" stroke-dasharray="6 4" transform="rotate(35)">
        <animateTransform attributeName="transform" type="rotate" from="35" to="-325" dur="18s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- Main Universe Celestial Sphere Body -->
    <circle cx="0" cy="0" r="30" fill="url(#sphere-core)" filter="url(#cosmic-glow)"/>

    <!-- Latitude Grid Line on Sphere (Rotating Effect) -->
    <ellipse cx="0" cy="0" rx="30" ry="10" fill="none" stroke="#bae6fd" stroke-opacity="0.4" stroke-width="0.8">
      <animate attributeName="ry" values="10;0;10" dur="8s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="0" rx="12" ry="30" fill="none" stroke="#bae6fd" stroke-opacity="0.3" stroke-width="0.8">
      <animate attributeName="rx" values="12;0;12" dur="8s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Orbiting Particle Moons / Stellar Nodes -->
    <g>
      <circle cx="55" cy="0" r="2.5" fill="#38bdf8" filter="url(#cosmic-glow)"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </g>

    <g>
      <circle cx="-42" cy="0" r="2" fill="#f59e0b" filter="url(#cosmic-glow)"/>
      <animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="12s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
