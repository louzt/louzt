<?xml version="1.0" encoding="UTF-8"?>
<!--
  section-tactical-posture.svg — Batman / Dark Knight tactical stealth banner (1200x110).
  Designed for LOUST profile README.
  Features: Monochromatic Gotham slate background, sharp angular stealth geometry,
  bat-wing tactical bevels, HUD crosshair accents, and high-contrast typography.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" width="1200" height="110" role="img" aria-label="Tactical Engineering &amp; Systems Architecture — section banner">
  <defs>
    <!-- Dark Knight background gradient -->
    <linearGradient id="bat-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#070d19"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Metallic edge highlight gradient -->
    <linearGradient id="bat-edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.2"/>
      <stop offset="15%" stop-color="#475569" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#94a3b8" stop-opacity="1"/>
      <stop offset="85%" stop-color="#475569" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Subtle gold/amber tactical glowing beam -->
    <linearGradient id="bat-beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Tactical grid pattern -->
    <pattern id="bat-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
      <circle cx="0" cy="0" r="1" fill="#38bdf8" fill-opacity="0.2"/>
    </pattern>

    <!-- Hexagonal stealth mesh -->
    <pattern id="bat-hex" width="28" height="48.497" patternUnits="userSpaceOnUse">
      <path d="M 14 0 L 28 8.082 L 28 24.249 L 14 32.331 L 0 24.249 L 0 8.082 Z M 14 48.497 L 28 40.415 L 28 24.249 L 14 32.331 L 0 24.249 L 0 40.415 Z" fill="none" stroke="#ffffff" stroke-opacity="0.02" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Canvas Base -->
  <rect width="1200" height="110" fill="url(#bat-bg)"/>
  <rect width="1200" height="110" fill="url(#bat-hex)"/>
  <rect width="1200" height="110" fill="url(#bat-grid)"/>

  <!-- Outer Dark Knight Stealth Frame & Angular Corner Cutouts -->
  <!-- Top Left Tactical Bracket -->
  <path d="M 20 35 L 20 20 L 35 20" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.7"/>
  <path d="M 15 45 L 15 15 L 45 15" fill="none" stroke="#475569" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Top Right Tactical Bracket -->
  <path d="M 1180 35 L 1180 20 L 1165 20" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.7"/>
  <path d="M 1185 45 L 1185 15 L 1155 15" fill="none" stroke="#475569" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Bottom Left Tactical Bracket -->
  <path d="M 20 75 L 20 90 L 35 90" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.7"/>
  <path d="M 15 65 L 15 95 L 45 95" fill="none" stroke="#475569" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Bottom Right Tactical Bracket -->
  <path d="M 1180 75 L 1180 90 L 1165 90" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.7"/>
  <path d="M 1185 65 L 1185 95 L 1155 95" fill="none" stroke="#475569" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Central Bat-Wing Geometric Stealth Crest Outline -->
  <path d="M 450 15 L 530 15 L 570 30 L 600 22 L 630 30 L 670 15 L 750 15 L 730 35 L 680 38 L 600 52 L 520 38 L 470 35 Z" fill="#0f172a" fill-opacity="0.6" stroke="#334155" stroke-width="1.5"/>

  <!-- Top & Bottom Metallic Bevel Lines -->
  <line x1="60" y1="2" x2="1140" y2="2" stroke="url(#bat-edge)" stroke-width="2"/>
  <line x1="100" y1="108" x2="1100" y2="108" stroke="url(#bat-beam)" stroke-width="2"/>

  <!-- Tactical HUD Crosshair Markers -->
  <circle cx="120" cy="55" r="8" fill="none" stroke="#94a3b8" stroke-dasharray="2 2" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="120" cy="55" r="2" fill="#38bdf8" fill-opacity="0.8"/>
  <line x1="110" y1="55" x2="130" y2="55" stroke="#94a3b8" stroke-width="1" stroke-opacity="0.3"/>

  <circle cx="1080" cy="55" r="8" fill="none" stroke="#94a3b8" stroke-dasharray="2 2" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="1080" cy="55" r="2" fill="#f59e0b" fill-opacity="0.8"/>
  <line x1="1070" y1="55" x2="1090" y2="55" stroke="#94a3b8" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Main Section Title -->
  <text x="600" y="60" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="21" font-weight="800" fill="#f8fafc" letter-spacing="3.5">SYSTEMS ARCHITECTURE &amp; OPERATIONAL POSTURE</text>

  <!-- Subtitle Tagline -->
  <text x="600" y="86" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="2">DETERMINISTIC HARNESSES · ZERO-EGRESS HARDENING · HIGH-DENSITY INFRASTRUCTURE</text>
</svg>
